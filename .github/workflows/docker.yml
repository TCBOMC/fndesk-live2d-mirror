name: Build and Push Docker Image

# 在以下情况触发构建：
#   - 推送到 main 分支
#   - 推送 v* 标签（如 v1.0.0），自动生成对应版本标签
#   - 手动在 Actions 页面点击 Run workflow
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# 最小权限原则：仅授予镜像构建/推送所需权限
permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/tcbomc/fndesk-live2d-mirror
  DH_IMAGE: docker.io/trseimc/fndesk-live2d-mirror

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多架构构建需要 QEMU + Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像标签：分支名 / 语义化版本 / commit sha / latest（仅默认分支）
      # 同时写入两个 registry，缺失的 Docker Hub 登录会被上面的 if 跳过（仅推 GHCR）
      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DH_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Fndesk Live2D Mirror
            org.opencontainers.image.description=Fndesk Live2D 资源站镜像（模型列表 + 模型下载，定时增量同步）
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 构建并推送；缓存走 GitHub Actions 缓存（gha），加速后续构建
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
